<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>成长印记 — 开发工作清单</title>
<style>
@font-face {
  font-family: 'WorkSans';
  src: url('./_shared/fonts/WorkSans-Regular.ttf') format('truetype');
  font-weight: 400;
}
@font-face {
  font-family: 'WorkSans';
  src: url('./_shared/fonts/WorkSans-Bold.ttf') format('truetype');
  font-weight: 700;
}
@font-face {
  font-family: 'JetBrainsMono';
  src: url('./_shared/fonts/JetBrainsMono-Regular.ttf') format('truetype');
  font-weight: 400;
}

:root {
  --bg: #FFFBF7;
  --bg2: #FFF3E6;
  --bg3: #F5E6D3;
  --ink: #2D2420;
  --muted: #8C7B6E;
  --rule: #E8D5C4;
  --accent: #E8833A;
  --accent2: #5B8C5A;
  --accent3: #4A6FA5;
  --danger: #C0564A;
  --success: #5B8C5A;
  --warning: #D4A537;
  --font-heading: 'WorkSans', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --font-body: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif;
  --font-mono: 'JetBrainsMono', 'Cascadia Code', 'Consolas', monospace;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; scroll-behavior: smooth; }
body {
  font-family: var(--font-body);
  font-size: 1rem;
  line-height: 1.8;
  color: var(--ink);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
}

/* ===== Header ===== */
.header {
  background: linear-gradient(135deg, #FFF3E6 0%, #FFE4CC 40%, #FFD4B8 100%);
  padding: 2.5rem 1.5rem 2rem;
  border-bottom: 1px solid var(--rule);
}
.header-content {
  max-width: 1100px;
  margin: 0 auto;
}
.header-tag {
  display: inline-block;
  background: var(--accent);
  color: #fff;
  font-size: 0.8rem;
  font-weight: 700;
  padding: 0.3rem 1rem;
  border-radius: 20px;
  letter-spacing: 0.06em;
  margin-bottom: 1rem;
  font-family: var(--font-heading);
}
.header h1 {
  font-family: var(--font-heading);
  font-size: 2rem;
  font-weight: 700;
  color: var(--ink);
  margin-bottom: 0.5rem;
  letter-spacing: -0.02em;
}
.header .subtitle {
  font-size: 1rem;
  color: var(--muted);
  max-width: 600px;
}

/* ===== Progress Dashboard ===== */
.dashboard {
  max-width: 1100px;
  margin: -1rem auto 0;
  padding: 0 1.5rem;
  position: relative;
  z-index: 10;
}
.dashboard-card {
  background: #fff;
  border-radius: 12px;
  padding: 1.5rem;
  box-shadow: 0 4px 20px rgba(45,36,32,0.08);
  border: 1px solid var(--rule);
}
.progress-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 1.25rem;
  margin-bottom: 1.25rem;
}
.progress-item {
  text-align: center;
}
.progress-item .label {
  font-size: 0.82rem;
  color: var(--muted);
  font-weight: 600;
  margin-bottom: 0.5rem;
  font-family: var(--font-heading);
}
.progress-item .value {
  font-size: 1.8rem;
  font-weight: 700;
  color: var(--ink);
  font-family: var(--font-heading);
  line-height: 1;
}
.progress-item .value .total {
  font-size: 1rem;
  color: var(--muted);
  font-weight: 400;
}
.progress-bar-wrap {
  height: 8px;
  background: var(--bg3);
  border-radius: 4px;
  overflow: hidden;
  margin-top: 0.5rem;
}
.progress-bar {
  height: 100%;
  border-radius: 4px;
  transition: width 0.5s ease;
  background: var(--accent);
}
.progress-bar.backend { background: var(--accent3); }
.progress-bar.frontend { background: var(--accent); }
.progress-bar.integration { background: var(--accent2); }
.progress-bar.delivery { background: var(--warning); }
.progress-bar.overall { background: linear-gradient(90deg, var(--accent3), var(--accent), var(--accent2)); }

/* Week progress */
.week-progress {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 0.75rem;
  padding-top: 1rem;
  border-top: 1px solid var(--rule);
}
.week-item {
  display: flex;
  align-items: center;
  gap: 0.5rem;
}
.week-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
  background: var(--bg3);
  transition: background 0.3s;
}
.week-dot.active { background: var(--accent); }
.week-dot.done { background: var(--accent2); }
.week-item .week-label {
  font-size: 0.8rem;
  color: var(--muted);
  font-weight: 600;
}
.week-item .week-count {
  font-size: 0.78rem;
  color: var(--ink);
  font-family: var(--font-mono);
}

/* ===== Filter Bar ===== */
.filter-bar {
  max-width: 1100px;
  margin: 1.5rem auto 0;
  padding: 0 1.5rem;
  display: flex;
  gap: 0.75rem;
  flex-wrap: wrap;
  align-items: center;
}
.filter-btn {
  padding: 0.4rem 1rem;
  border: 1px solid var(--rule);
  border-radius: 20px;
  background: #fff;
  color: var(--muted);
  font-size: 0.85rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  font-family: var(--font-body);
}
.filter-btn:hover { border-color: var(--accent); color: var(--accent); }
.filter-btn.active {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}
.filter-btn .count {
  font-size: 0.75rem;
  opacity: 0.8;
  margin-left: 0.25rem;
}
.filter-spacer { flex: 1; }
.reset-btn {
  padding: 0.4rem 1rem;
  border: 1px solid var(--rule);
  border-radius: 20px;
  background: #fff;
  color: var(--muted);
  font-size: 0.85rem;
  cursor: pointer;
  transition: all 0.2s;
}
.reset-btn:hover { border-color: var(--danger); color: var(--danger); }

/* ===== Task List ===== */
.container {
  max-width: 1100px;
  margin: 0 auto;
  padding: 1.5rem;
}
.week-section {
  margin-bottom: 2.5rem;
}
.week-header {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  margin-bottom: 1rem;
  padding-bottom: 0.5rem;
  border-bottom: 2px solid var(--accent);
}
.week-badge {
  background: var(--accent);
  color: #fff;
  font-size: 0.82rem;
  font-weight: 700;
  padding: 0.25rem 0.75rem;
  border-radius: 6px;
  font-family: var(--font-heading);
}
.week-badge.w1 { background: var(--danger); }
.week-badge.w2 { background: var(--accent); }
.week-badge.w3 { background: var(--accent); }
.week-badge.w4 { background: var(--accent2); }
.week-badge.w5 { background: var(--accent2); }
.week-badge.w6 { background: var(--accent3); }
.week-title {
  font-family: var(--font-heading);
  font-size: 1.3rem;
  font-weight: 700;
  color: var(--ink);
}
.week-desc {
  font-size: 0.88rem;
  color: var(--muted);
  margin-left: auto;
}
.week-progress-mini {
  font-size: 0.85rem;
  color: var(--muted);
  font-family: var(--font-mono);
  white-space: nowrap;
}

/* Task Card */
.task-card {
  display: flex;
  align-items: flex-start;
  gap: 1rem;
  padding: 1rem 1.25rem;
  background: #fff;
  border: 1px solid var(--rule);
  border-radius: 10px;
  margin-bottom: 0.75rem;
  transition: all 0.2s;
  cursor: pointer;
  position: relative;
}
.task-card:hover {
  border-color: var(--accent);
  box-shadow: 0 2px 12px rgba(232,131,58,0.1);
}
.task-card.completed {
  background: #F0F9F0;
  border-color: var(--accent2);
  opacity: 0.85;
}
.task-card.completed .task-name {
  text-decoration: line-through;
  color: var(--muted);
}

/* Checkbox */
.checkbox {
  width: 24px;
  height: 24px;
  border: 2px solid var(--rule);
  border-radius: 6px;
  flex-shrink: 0;
  margin-top: 2px;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #fff;
}
.checkbox:hover { border-color: var(--accent); }
.task-card.completed .checkbox {
  background: var(--accent2);
  border-color: var(--accent2);
}
.checkbox svg {
  width: 16px;
  height: 16px;
  color: #fff;
  opacity: 0;
  transition: opacity 0.2s;
}
.task-card.completed .checkbox svg { opacity: 1; }

/* Task Content */
.task-content {
  flex: 1;
  min-width: 0;
}
.task-header-row {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  flex-wrap: wrap;
  margin-bottom: 0.25rem;
}
.task-id {
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 700;
  padding: 0.12rem 0.45rem;
  border-radius: 4px;
  white-space: nowrap;
}
.task-id.backend { background: var(--accent3); color: #fff; }
.task-id.frontend { background: var(--accent); color: #fff; }
.task-id.test { background: var(--accent2); color: #fff; }
.task-id.delivery { background: var(--warning); color: #fff; }
.task-name {
  font-size: 1rem;
  font-weight: 700;
  color: var(--ink);
}
.pri {
  font-size: 0.7rem;
  font-weight: 700;
  padding: 0.1rem 0.4rem;
  border-radius: 4px;
  white-space: nowrap;
}
.pri.p0 { background: #C0564A; color: #fff; }
.pri.p1 { background: var(--accent); color: #fff; }
.pri.p2 { background: var(--accent2); color: #fff; }
.pri.p3 { background: var(--muted); color: #fff; }
.task-days {
  font-size: 0.78rem;
  color: var(--muted);
  font-family: var(--font-mono);
  white-space: nowrap;
}
.task-desc {
  font-size: 0.88rem;
  color: var(--muted);
  line-height: 1.6;
  margin-top: 0.25rem;
}
.task-deliverable {
  font-size: 0.82rem;
  color: var(--accent);
  margin-top: 0.25rem;
  font-weight: 600;
}
.task-card.completed .task-deliverable { color: var(--accent2); }

/* Status badge */
.status-badge {
  position: absolute;
  top: 0.75rem;
  right: 1rem;
  font-size: 0.72rem;
  font-weight: 700;
  padding: 0.15rem 0.5rem;
  border-radius: 4px;
}
.status-badge.done { background: var(--accent2); color: #fff; }
.status-badge.doing { background: var(--accent); color: #fff; }
.status-badge.todo { background: var(--bg3); color: var(--muted); }

/* ===== Footer ===== */
.footer {
  border-top: 2px solid var(--rule);
  padding: 2rem 1.5rem;
  text-align: center;
  color: var(--muted);
  font-size: 0.85rem;
  margin-top: 2rem;
}
.footer-stat {
  display: inline-block;
  margin: 0 1rem;
}
.footer-stat strong {
  color: var(--accent);
  font-size: 1.1rem;
}

/* ===== Responsive ===== */
@media (max-width: 768px) {
  .header h1 { font-size: 1.5rem; }
  .progress-row { grid-template-columns: 1fr 1fr; }
  .week-progress { grid-template-columns: 1fr 1fr; }
  .task-card { padding: 0.75rem; gap: 0.75rem; }
  .week-desc { display: none; }
}
</style>
</head>
<body>

<!-- ===== Header ===== -->
<header class="header">
  <div class="header-content">
    <span class="header-tag">开发工作清单</span>
    <h1>成长印记 · 开发任务跟踪</h1>
    <p class="subtitle">42项开发任务实时跟踪，自动记录进度。点击任务卡片勾选完成状态。</p>
  </div>
</header>

<!-- ===== Progress Dashboard ===== -->
<div class="dashboard">
  <div class="dashboard-card">
    <div class="progress-row">
      <div class="progress-item">
        <div class="label">总进度</div>
        <div class="value"><span id="overall-done">0</span><span class="total">/<span id="overall-total">42</span></span></div>

          <div class="progress-bar backend" id="bar-backend" style="width:0%"></div>
        </div>
      </div>
      <div class="progress-item">
        <div class="label">前端 Frontend</div>
        <div class="value"><span id="frontend-done">0</span><span class="total">/<span id="frontend-total">16</span></span></div>

      <div class="progress-item">

        <div class="value"><span id="integration-done">0</span><span class="total">/<span id="integration-total">5</span></span></div>
        <div class="progress-bar-wrap">
          <div class="progress-bar integration" id="bar-integration" style="width:0%"></div>
        </div>
      </div>
      <div class="progress-item">
        <div class="label">交付 Delivery</div>
        <div class="value"><span id="delivery-done">0</span><span class="total">/<span id="delivery-total">5</span></span></div>
        <div class="progress-bar-wrap">
          <div class="progress-bar delivery" id="bar-delivery" style="width:0%"></div>
        </div>
      </div>
    </div>
    <div class="week-progress" id="week-progress">
      <!-- Generated by JS -->
    </div>
  </div>
</div>

<!-- ===== Filter Bar ===== -->
<div class="filter-bar">
  <button class="filter-btn active" data-filter="all">全部 <span class="count" id="count-all">42</span></button>
  <button class="filter-btn" data-filter="backend">后端 <span class="count" id="count-backend">16</span></button>
  <button class="filter-btn" data-filter="frontend">前端 <span class="count" id="count-frontend">16</span></button>
  <button class="filter-btn" data-filter="integration">联调 <span class="count" id="count-integration">5</span></button>
  <button class="filter-btn" data-filter="delivery">交付 <span class="count" id="count-delivery">5</span></button>
  <button class="filter-btn" data-filter="todo">待完成 <span class="count" id="count-todo">0</span></button>
  <button class="filter-btn" data-filter="done">已完成 <span class="count" id="count-done">0</span></button>
  <div class="filter-spacer"></div>
  <button class="reset-btn" id="reset-btn">重置进度</button>
</div>

<!-- ===== Task List ===== -->
<div class="container" id="task-list">
  <!-- Generated by JS -->
</div>

<!-- ===== Footer ===== -->
<footer class="footer">
  <p>
    <span class="footer-stat">已完成 <strong id="footer-done">0</strong> 项</span>
    <span class="footer-stat">总任务 <strong>42</strong> 项</span>
    <span class="footer-stat">完成率 <strong id="footer-rate">0%</strong></span>
  </p>
  <p style="margin-top:0.5rem;">成长印记（Growth Mark）· 2026</p>
</footer>

const STORAGE_KEY = 'growth-mark-dev-checklist';

// ===== Load state from localStorage =====
function loadState() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const savedTasks = JSON.parse(saved);
      savedTasks.forEach(s => {
        const task = tasks.find(t => t.id === s.id);
        if (task) task.completed = s.completed;
      });
    }
  } catch(e) { console.error('Load state error:', e); }
}

// ===== Save state to localStorage =====
function saveState() {
  try {
    const state = tasks.map(t => ({ id: t.id, completed: t.completed }));
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch(e) { console.error('Save state error:', e); }
}

// ===== Render tasks =====
let currentFilter = 'all';

function renderTasks() {
  const container = document.getElementById('task-list');
  let html = '';

  for (let week = 1; week <= 6; week++) {
    let weekTasks = tasks.filter(t => t.week === week);
    
    // Apply filter
    if (currentFilter === 'todo') {
      weekTasks = weekTasks.filter(t => !t.completed);
    } else if (currentFilter === 'done') {
      weekTasks = weekTasks.filter(t => t.completed);
    } else if (currentFilter !== 'all') {
      weekTasks = weekTasks.filter(t => t.category === currentFilter);
    }

    if (weekTasks.length === 0) continue;

    const info = weekInfo[week];
    const weekDone = tasks.filter(t => t.week === week && t.completed).length;
    const weekTotal = tasks.filter(t => t.week === week).length;
    const weekRate = weekTotal > 0 ? Math.round(weekDone / weekTotal * 100) : 0;

    html += `<div class="week-section">
      <div class="week-header">
        <span class="week-badge ${info.badge}">Week ${week}</span>
        <span class="week-title">${info.title}</span>
        <span class="week-desc">${info.desc}</span>
        <span class="week-progress-mini">${weekDone}/${weekTotal} (${weekRate}%)</span>
      </div>`;

    weekTasks.forEach(task => {
      const checkIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>`;
      const statusClass = task.completed ? 'done' : 'todo';
      const statusText = task.completed ? '已完成' : '待开发';
      html += `<div class="task-card ${task.completed ? 'completed' : ''}" data-id="${task.id}">
        <div class="checkbox">${checkIcon}</div>
        <div class="task-content">
          <div class="task-header-row">
            <span class="task-id ${task.category}">${task.id}</span>
            <span class="task-name">${task.name}</span>
            <span class="pri ${task.priority.toLowerCase()}">${task.priority}</span>
            <span class="task-days">${task.days}天</span>
          </div>
          <div class="task-desc">${task.desc}</div>
          <div class="task-deliverable">交付物：${task.deliverable}</div>
        </div>
        <span class="status-badge ${statusClass}">${statusText}</span>
      </div>`;
    });

    html += `</div>`;
  }

  if (html === '') {
    html = '<div style="text-align:center;padding:3rem;color:var(--muted);">该筛选条件下无任务</div>';
  }

  container.innerHTML = html;

  // Bind click events
  document.querySelectorAll('.task-card').forEach(card => {
    card.addEventListener('click', function() {
      const id = this.dataset.id;
      const task = tasks.find(t => t.id === id);
      if (task) {
        task.completed = !task.completed;
        saveState();
        renderTasks();
        updateProgress();
      }
    });
  });
}

// ===== Update progress =====
function updateProgress() {
  const categories = ['backend', 'frontend', 'integration', 'delivery'];
  let totalDone = 0;
  let totalAll = 0;

  categories.forEach(cat => {
    const catTasks = tasks.filter(t => t.category === cat);
    const done = catTasks.filter(t => t.completed).length;
    const total = catTasks.length;
    totalDone += done;
    totalAll += total;

    const doneEl = document.getElementById(`${cat}-done`);
    const totalEl = document.getElementById(`${cat}-total`);
    const barEl = document.getElementById(`bar-${cat}`);
    if (doneEl) doneEl.textContent = done;
    if (totalEl) totalEl.textContent = total;
    if (barEl) barEl.style.width = (total > 0 ? done / total * 100 : 0) + '%';
  });

  // Overall
  document.getElementById('overall-done').textContent = totalDone;
  document.getElementById('overall-total').textContent = totalAll;
  document.getElementById('bar-overall').style.width = (totalAll > 0 ? totalDone / totalAll * 100 : 0) + '%';

  // Filter counts
  document.getElementById('count-all').textContent = tasks.length;
  document.getElementById('count-backend').textContent = tasks.filter(t => t.category === 'backend').length;
  document.getElementById('count-frontend').textContent = tasks.filter(t => t.category === 'frontend').length;
  document.getElementById('count-integration').textContent = tasks.filter(t => t.category === 'integration').length;
  document.getElementById('count-delivery').textContent = tasks.filter(t => t.category === 'delivery').length;
  document.getElementById('count-todo').textContent = tasks.filter(t => !t.completed).length;
  document.getElementById('count-done').textContent = tasks.filter(t => t.completed).length;

  // Footer
  document.getElementById('footer-done').textContent = totalDone;
  document.getElementById('footer-rate').textContent = (totalAll > 0 ? Math.round(totalDone / totalAll * 100) : 0) + '%';

  // Week progress dots
  renderWeekProgress();
}

// ===== Render week progress =====
function renderWeekProgress() {
  const container = document.getElementById('week-progress');
  let html = '';
  for (let week = 1; week <= 6; week++) {
    const weekTasks = tasks.filter(t => t.week === week);
    const done = weekTasks.filter(t => t.completed).length;
    const total = weekTasks.length;
    const allDone = done === total;
    const hasProgress = done > 0;
    const dotClass = allDone ? 'done' : (hasProgress ? 'active' : '');
    html += `<div class="week-item">
      <span class="week-dot ${dotClass}"></span>
      <span class="week-label">W${week}</span>
      <span class="week-count">${done}/${total}</span>
    </div>`;
  }
  container.innerHTML = html;
}

// ===== Filter buttons =====
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
    currentFilter = this.dataset.filter;
    renderTasks();
  });
});

// ===== Reset button =====
document.getElementById('reset-btn').addEventListener('click', function() {
  if (confirm('确定要重置所有进度吗？此操作不可撤销。')) {
    tasks.forEach(t => t.completed = false);
    saveState();
    renderTasks();
    updateProgress();
  }
});

// ===== Init =====
loadState();
renderTasks();
updateProgress();
</script>
