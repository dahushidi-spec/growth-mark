# 成长印记 · Nginx 反向代理配置
# 用法：将此文件挂载到 /etc/nginx/conf.d/default.conf
# 或使用 docker-compose 的 nginx 服务

upstream growth_mark_api {
    server api:8000;
    # 横向扩展时追加更多后端实例：
    # server api2:8000;
}

server {
    listen 80;
    server_name _;

    # 客户端上传文件大小限制（与后端 10MB 保持一致 + 余量）
    client_max_body_size 15M;

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 请求 ID 透传（若客户端未携带则生成）
    proxy_set_header X-Request-ID $request_id;

    # API 反向代理
    location /api/ {
        proxy_pass http://growth_mark_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时配置（AI 接口可能较慢）
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 上传文件静态服务
    location /uploads/ {
        proxy_pass http://growth_mark_api;
        proxy_set_header Host $host;
        # 缓存静态文件
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # 健康检查端点（不记日志）
    location /health {
        proxy_pass http://growth_mark_api;
        access_log off;
    }

    # API 文档（仅开发/staging 环境开放，生产可注释）
    location /docs {
        proxy_pass http://growth_mark_api;
        proxy_set_header Host $host;
    }
    location /redoc {
        proxy_pass http://growth_mark_api;
        proxy_set_header Host $host;
    }
    location /openapi.json {
        proxy_pass http://growth_mark_api;
        proxy_set_header Host $host;
    }

    # 根路径：可挂载前端构建产物（Flutter Web）
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
